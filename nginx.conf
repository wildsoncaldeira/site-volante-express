# ==============================================================================
# Nginx Configuration for Volante Express (volanteexpress.com.br)
# Includes Markdown Content Negotiation (acceptmarkdown.com / is-agentic compliant)
# and Agent-friendly 404s with text/markdown response.
# ==============================================================================

map $http_accept $wants_markdown {
    default 0;
    "~*text/markdown" 1;
}

server {
    server_name volanteexpress.com.br www.volanteexpress.com.br;
    root /var/www/volante-express;
    index index.html index.md;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/volanteexpress.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/volanteexpress.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Cabeçalho Vary para que Cloudflare e clientes diferenciem Markdown de HTML
    add_header Vary "Accept" always;

    # 1. Negociação de conteúdo na Homepage (/)
    location = / {
        if ($wants_markdown) {
            rewrite ^ /index.md last;
        }
        try_files /index.html =404;
    }

    # 2. Rotas limpas das páginas de confiança
    location = /about {
        if ($wants_markdown) {
            rewrite ^ /about.md last;
        }
        try_files /about.html /about/index.html =404;
    }

    location = /contact {
        if ($wants_markdown) {
            rewrite ^ /contact.md last;
        }
        try_files /contact.html /contact/index.html =404;
    }

    location = /privacy {
        if ($wants_markdown) {
            rewrite ^ /privacy.md last;
        }
        try_files /privacy.html /privacy/index.html =404;
    }

    # 3. Arquivos Markdown (.md)
    location ~* \.md$ {
        default_type "text/markdown; charset=utf-8";
        add_header Vary "Accept" always;
    }

    # 4. Resposta 404 em Markdown
    location = /404.md {
        default_type "text/markdown; charset=utf-8";
        add_header Vary "Accept" always;
        return 404 "# 404 - Página Não Encontrada | Volante Express\n\nO recurso solicitado não existe no servidor.\n\nLinks Úteis:\n- https://volanteexpress.com.br/\n- https://volanteexpress.com.br/llms.txt\n- https://volanteexpress.com.br/sitemap.xml\n- https://volanteexpress.com.br/contact\n\nWhatsApp: +55 (31) 99629-4103\n";
    }

    # 5. Roteamento de erro 404 Agent-Friendly
    error_page 404 @agent_404;
    location @agent_404 {
        if ($wants_markdown) {
            rewrite ^ /404.md last;
        }
        try_files /404.html =404;
    }

    # 6. Arquivos estáticos gerais
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}

server {
    if ($host = www.volanteexpress.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = volanteexpress.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name volanteexpress.com.br www.volanteexpress.com.br;
    return 404; # managed by Certbot
}
