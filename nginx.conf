# ==============================================================================
# Nginx Configuration for Volante Express (volanteexpress.com.br)
# Includes Markdown Content Negotiation (acceptmarkdown.com / is-agentic compliant)
# and Agent-friendly 404s with text/markdown response.
# ==============================================================================

# 1. Map Accept header to detect text/markdown request from AI agents
map $http_accept $wants_markdown {
    default 0;
    "~*text/markdown" 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name volanteexpress.com.br www.volanteexpress.com.br;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name volanteexpress.com.br www.volanteexpress.com.br;

    # SSL certificates (ajuste os caminhos conforme sua instalação Certbot)
    # ssl_certificate /etc/letsencrypt/live/volanteexpress.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/volanteexpress.com.br/privkey.pem;

    root /var/www/site-volante-express;
    index index.html index.md;

    # Cabeçalho Vary para que Cloudflare e proxies diferenciem caches por Accept
    add_header Vary "Accept, Accept-Encoding" always;

    # Gzip para performance
    gzip on;
    gzip_types text/plain text/css text/javascript text/markdown application/javascript application/json application/xml;

    # --------------------------------------------------------------------------
    # Content Negotiation para a Homepage (/)
    # --------------------------------------------------------------------------
    location = / {
        if ($wants_markdown) {
            default_type "text/markdown; charset=utf-8";
            add_header Content-Type "text/markdown; charset=utf-8" always;
            add_header Vary "Accept" always;
            rewrite ^ /index.md break;
        }
        add_header Vary "Accept" always;
        try_files /index.html =404;
    }

    # --------------------------------------------------------------------------
    # Trust Anchor Pages (/about, /contact, /privacy)
    # --------------------------------------------------------------------------
    location = /about {
        if ($wants_markdown) {
            default_type "text/markdown; charset=utf-8";
            add_header Content-Type "text/markdown; charset=utf-8" always;
            add_header Vary "Accept" always;
            rewrite ^ /about.md break;
        }
        add_header Vary "Accept" always;
        try_files /about.html /about/index.html =404;
    }

    location = /contact {
        if ($wants_markdown) {
            default_type "text/markdown; charset=utf-8";
            add_header Content-Type "text/markdown; charset=utf-8" always;
            add_header Vary "Accept" always;
            rewrite ^ /contact.md break;
        }
        add_header Vary "Accept" always;
        try_files /contact.html /contact/index.html =404;
    }

    location = /privacy {
        if ($wants_markdown) {
            default_type "text/markdown; charset=utf-8";
            add_header Content-Type "text/markdown; charset=utf-8" always;
            add_header Vary "Accept" always;
            rewrite ^ /privacy.md break;
        }
        add_header Vary "Accept" always;
        try_files /privacy.html /privacy/index.html =404;
    }

    # --------------------------------------------------------------------------
    # Arquivos Markdown diretos (.md)
    # --------------------------------------------------------------------------
    location ~* \.md$ {
        default_type "text/markdown; charset=utf-8";
        add_header Content-Type "text/markdown; charset=utf-8" always;
        add_header Vary "Accept" always;
    }

    # --------------------------------------------------------------------------
    # Arquivos estáticos gerais (CSS, JS, Imagens, sitemap, robots, llms)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # --------------------------------------------------------------------------
    # 404 Agent-Friendly (is-agentic check)
    # Retorna corpo em Markdown se Accept: text/markdown for recebido
    # --------------------------------------------------------------------------
    error_page 404 = @custom_404;

    location @custom_404 {
        if ($wants_markdown) {
            default_type "text/markdown; charset=utf-8";
            add_header Content-Type "text/markdown; charset=utf-8" always;
            add_header Vary "Accept" always;
            return 404 "# 404 - Página Não Encontrada | Volante Express\n\nO recurso solicitado não existe no servidor.\n\nLinks Úteis:\n- https://volanteexpress.com.br/\n- https://volanteexpress.com.br/llms.txt\n- https://volanteexpress.com.br/sitemap.xml\n- https://volanteexpress.com.br/contact\n\nWhatsApp de Atendimento: +55 (31) 99629-4103\n";
        }
        add_header Vary "Accept" always;
        try_files /404.html =404;
    }
}
